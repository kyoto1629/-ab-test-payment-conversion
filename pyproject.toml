[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utilities-payment-ab-test"
version = "0.1.0"
description = "Воспроизводимый анализ A/B-теста формы оплаты ЖКХ"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "openpyxl>=3.1,<4", "reportlab>=4,<5"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbformat>=5,<6", "ipykernel>=6,<8"]

[project.scripts]
ab-test = "ab_test.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
